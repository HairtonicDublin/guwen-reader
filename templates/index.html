<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古诗文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #faf8f5;
            --bg-secondary: #ffffff;
            --text-primary: #2c2c2c;
            --text-secondary: #666;
            --accent: #8b5a2b;
            --accent-light: #d4a574;
            --border: #e8e4df;
            --highlight: #fff3cd;
            --highlight-border: #ffc107;
        }

        body {
            font-family: "Noto Serif SC", "Songti SC", serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
        }

        .container {
            display: flex;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px;
            gap: 16px;
        }

        .reader-panel {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .reader-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .reader-title {
            font-size: 1.3rem;
            color: var(--accent);
        }

        .tip-bar {
            padding: 8px 20px;
            background: #fffbeb;
            font-size: 0.8rem;
            color: var(--accent);
            display: none;
        }

        .reader-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .reader-placeholder {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
        }

        .reader-placeholder h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--accent-light);
        }

        .text-content {
            font-size: 1.15rem;
            line-height: 2.2;
        }

        .text-content::selection,
        .text-content *::selection {
            background: var(--accent-light);
            color: white;
        }

        .char {
            cursor: pointer;
        }

        .char:hover {
            background: rgba(139, 90, 43, 0.15);
            border-radius: 2px;
        }

        .char.highlighted {
            background: var(--highlight);
            border-bottom: 2px solid var(--highlight-border);
        }

        .char.active {
            background: var(--accent-light);
            color: white;
        }

        .tool-panel {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .panel-body {
            padding: 12px;
        }

        .book-list {
            max-height: 160px;
            overflow-y: auto;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .book-item:hover {
            background: var(--bg-primary);
        }

        .book-item.active {
            background: rgba(139, 90, 43, 0.1);
        }

        .book-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .book-delete {
            padding: 2px 6px;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            background: none;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
        }

        .book-item:hover .book-delete {
            opacity: 1;
        }

        .book-delete:hover {
            background: #e74c3c;
            color: white;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--accent-light);
        }

        .upload-icon {
            font-size: 1.5rem;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        #file-input {
            display: none;
        }

        .notebook-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .notebook-btn:hover {
            opacity: 0.9;
        }

        .ai-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }

        .ai-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .ai-waiting {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
        }

        .ai-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .explanation-result {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 12px;
        }

        .explanation-word {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .explanation-text {
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .selection-popup {
            position: fixed;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            padding: 8px;
            display: none;
            z-index: 9999;
            border: 1px solid var(--border);
        }

        .selection-popup button {
            padding: 10px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .selection-popup button:hover {
            background: var(--accent-light);
        }

        .selection-popup button:active {
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .empty-text {
            color: var(--text-secondary);
            text-align: center;
            padding: 16px;
        }

        .paragraph {
            margin-bottom: 1.5em;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .tool-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="reader-panel">
            <div class="reader-header">
                <h1 class="reader-title" id="book-title">古诗文学习</h1>
            </div>
            <div class="tip-bar" id="tip-bar">💡 单击查字 | 选中多字点击按钮解释 | 再次点击黄色高亮可取消</div>
            <div class="reader-content" id="reader-content">
                <div class="reader-placeholder" id="placeholder">
                    <h2>请导入书籍</h2>
                    <p>支持 PDF / EPUB 格式</p>
                </div>
                <div class="text-content" id="text-content" style="display:none;"></div>
            </div>
        </div>

        <div class="tool-panel">
            <div class="panel-card">
                <div class="panel-header">📚 书籍</div>
                <div class="panel-body">
                    <div class="book-list" id="book-list">
                        <p class="empty-text">暂无</p>
                    </div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-body">
                    <button class="notebook-btn" onclick="openNotebook()">📖 生词本</button>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-header">导入</div>
                <div class="panel-body">
                    <div class="upload-area" id="upload-area">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">点击或拖拽文件</div>
                    </div>
                    <input type="file" id="file-input" accept=".pdf,.epub">
                </div>
            </div>

            <div class="panel-card ai-panel">
                <div class="panel-header">AI 解释</div>
                <div class="ai-content" id="ai-content">
                    <div class="ai-waiting" id="ai-waiting">
                        <p>点击或选中文字查询</p>
                    </div>
                    <div id="ai-result" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="selection-popup" id="popup">
        <button onclick="explainSelection()">📖 解释</button>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        let currentBookId = null;
        let currentBookTitle = '';
        let currentContent = '';
        let highlightedIndices = new Set();

        // 高亮存储 - 使用书名的哈希作为 key
        function getHighlightKey(title) {
            // 移除特殊字符，确保 key 有效
            const safeTitle = (title || '').replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
            return `highlight_${safeTitle}`;
        }

        function loadHighlights(title) {
            if (!title) return new Set();
            try {
                const key = getHighlightKey(title);
                const d = localStorage.getItem(key);
                console.log('[高亮] 加载:', key, '数据:', d ? `${JSON.parse(d).length}个` : '无');
                return d ? new Set(JSON.parse(d)) : new Set();
            } catch (e) {
                console.error('[高亮] 加载失败:', e);
                return new Set();
            }
        }

        function saveHighlights(title, set) {
            if (!title) {
                console.warn('[高亮] 书名为空，无法保存');
                return;
            }
            try {
                const key = getHighlightKey(title);
                const arr = [...set];
                localStorage.setItem(key, JSON.stringify(arr));
                console.log('[高亮] 保存:', key, '数量:', arr.length);
            } catch (e) {
                console.error('[高亮] 保存失败:', e);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
            setupUpload();
            setupSelection();

            const savedId = localStorage.getItem('currentBookId');
            if (savedId) loadBook(parseInt(savedId), true);
        });

        // 加载书籍列表
        async function loadBooks() {
            try {
                const res = await fetch('/api/books');
                const books = await res.json();
                const list = document.getElementById('book-list');

                if (!books.length) {
                    list.innerHTML = '<p class="empty-text">暂无</p>';
                    return;
                }

                list.innerHTML = books.map(b => `
                    <div class="book-item ${currentBookId === b.id ? 'active' : ''}" onclick="loadBook(${b.id})">
                        <div>
                            <div class="book-name">${b.title}</div>
                            <div class="book-meta">${b.file_type.toUpperCase()}</div>
                        </div>
                        <button class="book-delete" onclick="event.stopPropagation();deleteBook(${b.id})">删除</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        // 加载书籍内容
        async function loadBook(id, restore = false) {
            showToast('加载中...');
            try {
                const res = await fetch(`/api/book/${id}`);
                const book = await res.json();

                if (book.error) {
                    showToast(book.error);
                    localStorage.removeItem('currentBookId');
                    return;
                }

                currentBookId = id;
                currentBookTitle = book.title;
                currentContent = book.content || '';

                // 加载高亮
                highlightedIndices = loadHighlights(book.title);
                console.log('[加载书籍]', book.title, '高亮数量:', highlightedIndices.size);

                localStorage.setItem('currentBookId', id);

                document.getElementById('book-title').textContent = book.title;
                document.getElementById('placeholder').style.display = 'none';
                document.getElementById('tip-bar').style.display = 'block';

                const tc = document.getElementById('text-content');
                tc.style.display = 'block';

                // 渲染内容
                renderContent(currentContent);

                if (restore) {
                    const pos = localStorage.getItem(`scroll_${id}`);
                    if (pos) {
                        setTimeout(() => {
                            document.getElementById('reader-content').scrollTop = parseInt(pos);
                        }, 100);
                    }
                }

                loadBooks();
                showToast('加载成功');
            } catch (e) {
                console.error('加载失败:', e);
                showToast('加载失败');
            }
        }

        // 渲染内容 - 分段处理提高性能
        function renderContent(content) {
            const tc = document.getElementById('text-content');
            tc.innerHTML = '';

            console.log('[渲染] 高亮数量:', highlightedIndices.size);
            if (highlightedIndices.size > 0) {
                console.log('[渲染] 高亮索引示例:', [...highlightedIndices].slice(0, 5));
            }

            // 按段落分割
            const paragraphs = content.split(/\n\n+/);
            let totalIndex = 0;
            let htmlContent = '';

            paragraphs.forEach((para) => {
                if (!para.trim()) return;

                let paraHtml = '<div class="paragraph">';
                for (let i = 0; i < para.length; i++) {
                    const char = para[i];
                    const idx = totalIndex++;

                    if (char === '\n') {
                        paraHtml += '<br>';
                    } else if (char === ' ') {
                        paraHtml += ' ';
                    } else if (/[，。！？、；：""''（）【】《》\s]/.test(char)) {
                        paraHtml += char;
                    } else {
                        const hl = highlightedIndices.has(idx) ? ' highlighted' : '';
                        paraHtml += `<span class="char${hl}" data-i="${idx}">${char}</span>`;
                    }
                }
                paraHtml += '</div>';
                htmlContent += paraHtml;
            });

            tc.innerHTML = htmlContent;

            // 添加点击事件
            tc.onclick = handleClick;

            console.log('[渲染] 完成，总字符索引:', totalIndex);
        }

        // 处理点击
        function handleClick(e) {
            const target = e.target;
            if (!target.classList.contains('char')) return;

            // 检查是否有选中文字
            const sel = window.getSelection();
            if (sel.toString().trim().length > 1) return;

            const char = target.textContent;
            const idx = parseInt(target.dataset.i);

            // 已高亮则取消
            if (target.classList.contains('highlighted')) {
                target.classList.remove('highlighted');
                highlightedIndices.delete(idx);
                saveHighlights(currentBookTitle, highlightedIndices);
                showToast('已取消高亮');
                return;
            }

            // 添加高亮
            document.querySelectorAll('.char.active').forEach(el => el.classList.remove('active'));
            target.classList.add('active', 'highlighted');
            highlightedIndices.add(idx);
            saveHighlights(currentBookTitle, highlightedIndices);

            // 获取上下文
            const chars = document.querySelectorAll('.char');
            const arr = Array.from(chars);
            const pos = arr.indexOf(target);
            let ctx = '';
            for (let i = Math.max(0, pos - 10); i < Math.min(arr.length, pos + 11); i++) {
                ctx += arr[i].textContent;
            }

            explainWord(char, ctx);
        }

        // 删除书籍
        async function deleteBook(id) {
            if (!confirm('确定删除？')) return;

            // 先获取书名用于删除高亮
            const res = await fetch(`/api/book/${id}`);
            const book = await res.json();
            const title = book.title;

            await fetch(`/api/book/${id}`, { method: 'DELETE' });
            localStorage.removeItem(`scroll_${id}`);
            if (title) localStorage.removeItem(getHighlightKey(title));

            if (currentBookId === id) {
                currentBookId = null;
                currentBookTitle = '';
                currentContent = '';
                highlightedIndices.clear();
                localStorage.removeItem('currentBookId');
                document.getElementById('book-title').textContent = '古诗文学习';
                document.getElementById('placeholder').style.display = 'flex';
                document.getElementById('tip-bar').style.display = 'none';
                document.getElementById('text-content').style.display = 'none';
            }
            loadBooks();
            showToast('已删除');
        }

        // 上传
        function setupUpload() {
            const area = document.getElementById('upload-area');
            const input = document.getElementById('file-input');

            area.onclick = () => input.click();
            area.ondragover = e => { e.preventDefault(); area.style.borderColor = '#8b5a2b'; };
            area.ondragleave = () => area.style.borderColor = '';
            area.ondrop = e => {
                e.preventDefault();
                area.style.borderColor = '';
                if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
            };
            input.onchange = e => { if (e.target.files[0]) uploadFile(e.target.files[0]); };
        }

        async function uploadFile(file) {
            showToast('上传中...');
            const fd = new FormData();
            fd.append('file', file);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    showToast('上传成功');
                    loadBooks();
                    loadBook(data.book_id);
                } else {
                    showToast(data.error || '失败');
                }
            } catch (e) {
                showToast('上传失败');
            }
        }

        // 文本选择
        function setupSelection() {
            const popup = document.getElementById('popup');

            document.addEventListener('mouseup', (e) => {
                setTimeout(() => {
                    const sel = window.getSelection();
                    const text = sel.toString().trim();
                    const tc = document.getElementById('text-content');

                    console.log('[选择] 选中文字:', text.length, '字');

                    // 选中超过1个字符
                    if (text.length > 1 && tc) {
                        // 检查选中的文字是否在阅读区域内
                        let isInTextContent = false;
                        if (sel.anchorNode) {
                            let node = sel.anchorNode;
                            while (node) {
                                if (node === tc || node.id === 'text-content') {
                                    isInTextContent = true;
                                    break;
                                }
                                node = node.parentNode;
                            }
                        }

                        console.log('[选择] 在文本区域内:', isInTextContent);

                        if (isInTextContent) {
                            try {
                                const range = sel.getRangeAt(0);
                                const rect = range.getBoundingClientRect();

                                let left = rect.left + rect.width / 2 - 50;
                                left = Math.max(10, Math.min(left, window.innerWidth - 120));
                                let top = rect.top - 50;
                                if (top < 10) top = rect.bottom + 10;

                                popup.style.left = left + 'px';
                                popup.style.top = top + 'px';
                                popup.style.display = 'block';
                                console.log('[选择] 显示弹窗');
                            } catch (err) {
                                console.error('[选择] 错误:', err);
                                popup.style.display = 'none';
                            }
                        } else {
                            popup.style.display = 'none';
                        }
                    } else {
                        popup.style.display = 'none';
                    }
                }, 100);
            });

            document.addEventListener('mousedown', e => {
                if (!popup.contains(e.target)) {
                    popup.style.display = 'none';
                }
            });
        }

        // 解释选中内容
        async function explainSelection() {
            const sel = window.getSelection();
            const text = sel.toString().trim();
            if (!text) return;

            document.getElementById('popup').style.display = 'none';

            // 高亮选中的字符
            const tc = document.getElementById('text-content');
            const range = sel.getRangeAt(0);
            tc.querySelectorAll('.char').forEach(el => {
                if (range.intersectsNode(el)) {
                    el.classList.add('highlighted');
                    const idx = parseInt(el.dataset.i);
                    if (!isNaN(idx)) highlightedIndices.add(idx);
                }
            });
            saveHighlights(currentBookTitle, highlightedIndices);

            const isWord = text.length <= 4 && !/[，。！？、；：]/.test(text);

            showAILoading();

            try {
                const endpoint = isWord ? '/api/explain/word' : '/api/explain/sentence';
                const body = isWord
                    ? { word: text, context: text, book_id: currentBookId }
                    : { sentence: text, book_id: currentBookId };

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                showExplanation(text, data.explanation);
            } catch (e) {
                showAIError('请求失败');
            }

            sel.removeAllRanges();
        }

        // 解释单字
        async function explainWord(word, context) {
            showAILoading();

            try {
                const res = await fetch('/api/explain/word', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word, context, book_id: currentBookId })
                });
                const data = await res.json();
                showExplanation(word, data.explanation);
            } catch (e) {
                showAIError('请求失败');
            }
        }

        // 打开生词本
        function openNotebook() {
            if (currentBookId) {
                const pos = document.getElementById('reader-content').scrollTop;
                localStorage.setItem(`scroll_${currentBookId}`, pos);
            }
            window.location.href = '/notebook';
        }

        // AI 显示
        function showAILoading() {
            document.getElementById('ai-waiting').style.display = 'none';
            const r = document.getElementById('ai-result');
            r.style.display = 'block';
            r.innerHTML = '<div class="ai-loading"><div class="spinner"></div>查询中...</div>';
        }

        function showExplanation(word, text) {
            document.getElementById('ai-result').innerHTML = `
                <div class="explanation-result">
                    <div class="explanation-word">${word}</div>
                    <div class="explanation-text">${text || '暂无'}</div>
                </div>`;
        }

        function showAIError(msg) {
            document.getElementById('ai-result').innerHTML = `<div style="color:#e74c3c;text-align:center;padding:20px;">${msg}</div>`;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>

</html>
